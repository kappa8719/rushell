[package]
name = "rushell"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol.workspace = true
bon.workspace = true
tokio.workspace = true
log.workspace = true
colog.workspace = true
bincode.workspace = true

[workspace]
members = ["interactive", "protocol"]

[workspace.dependencies]
protocol = { path = "./protocol" }

bon = "3.6.3"
tokio = { version = "1.45.0", features = ["sync", "net", "rt", "macros", "io-util", "rt-multi-thread"]}
thiserror = "2.0.12"
log = "0.4.26"
colog = "1.3.0"
bincode = "2.0.1"
